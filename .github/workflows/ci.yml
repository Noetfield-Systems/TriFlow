name: TriFlow CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node scripts/unpack.mjs
      - run: node scripts/bundle.mjs
      - name: Verify distribution roundtrip
        run: git diff --exit-code -- index.ts
      - name: Publish editable source files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish editable TriFlow source [skip ci]"
            git push
          fi
