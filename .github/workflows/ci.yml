name: TriFlow CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend and backend
        run: |
          node --check public/app.js
          node --check public/audio-worklet.js
          node --check src/handler.mjs
      - name: Check reproducible deploy bundle
        run: |
          node scripts/bundle.mjs
          sha256sum index.ts > /tmp/triflow-build.sha
          node scripts/bundle.mjs
          sha256sum index.ts > /tmp/triflow-rebuild.sha
          diff -u /tmp/triflow-build.sha /tmp/triflow-rebuild.sha
      - name: Test provider contracts and HTTP endpoints
        run: node --test tests/*.test.mjs
      - name: Install headless browser for UI E2E
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify desktop and mobile product flow
        env:
          SESSION_SECRET: local-browser-smoke-secret-longer-than-thirty-two-chars
        run: |
          PORT=3100 bun index.ts > /tmp/triflow-browser-server.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:3100/api/health > /dev/null; then break; fi; sleep 1; done
          node tests/browser-smoke.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triflow-browser-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore


  live-voice-e2e:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[voice-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate English + Spanish + French real audio fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
          espeak -v en-us -s 145 -w /tmp/tf-en.wav 'I was thinking maybe'
          espeak -v es -s 145 -w /tmp/tf-es.wav 'podemos hablar un poco'
          espeak -v fr -s 145 -w /tmp/tf-fr.wav 'pour organiser notre voyage demain'
          ffmpeg -hide_banner -loglevel error -y -i /tmp/tf-en.wav -i /tmp/tf-es.wav -i /tmp/tf-fr.wav -filter_complex '[0:a][1:a][2:a]concat=n=3:v=0:a=1,aresample=16000,aformat=sample_fmts=s16:channel_layouts=mono[out]' -map '[out]' -f s16le /tmp/triflow-mixed.pcm
      - name: Actual production speech + translation test (synthetic fixture)
        run: bun tests/live-voice-e2e.mjs
      - name: Publish proof data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triflow-live-voice-proof
          path: /tmp/triflow-live-voice-proof.json
          if-no-files-found: ignore
