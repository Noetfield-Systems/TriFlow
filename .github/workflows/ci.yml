name: TriFlow CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend and backend
        run: |
          node --check public/app.js
          node --check public/audio-worklet.js
          node --check src/handler.mjs
      - name: Check reproducible deploy bundle
        run: |
          node scripts/bundle.mjs
          git diff --exit-code -- index.ts
      - name: Test provider contracts and HTTP endpoints
        run: node --test tests/*.test.mjs
